name: fontify_plus
version: 0.6.0
description: >-
  Converts SVG icons to an OTF font and generates a Flutter-compatible class.
  Outlines stroked icons so outline-style sets render correctly. CLI and API.
homepage: https://github.com/4akloon/fontify_plus
repository: https://github.com/4akloon/fontify_plus
issue_tracker: https://github.com/4akloon/fontify_plus/issues

topics:
  - icons
  - fonts
  - svg
  - flutter
  - codegen

screenshots:
  - description: Example app gallery of generated IconData icons
    path: screenshots/example_gallery.webp

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  vector_graphics_compiler: ^1.3.0
  vector_math: '>=2.1.4 <3.0.0'
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1

executables:
  fontify_plus: fontify_plus
