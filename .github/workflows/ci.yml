name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the package's declared floor; stable catches new lints and
        # deprecations before they reach users.
        sdk: ['3.10', stable]

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get --no-example

      # The formatter's output changes between SDKs, so only pin it on stable.
      - name: Verify formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: Analyze
        run: dart analyze --fatal-infos

      # fonttools before dart test so variable_size_gate_test's pyftsubset
      # half is not skipped on the stable job that also runs the oracle.
      - uses: actions/setup-python@v5
        if: matrix.sdk == 'stable'
        with:
          python-version: '3.12'

      - name: Install fonttools and opentype-sanitizer
        if: matrix.sdk == 'stable'
        run: pip install fonttools opentype-sanitizer

      - name: Run tests
        run: dart test

      # Independent OTF / variable-font checks against fonts this package
      # just built (not committed fixtures, not varLib). Rebuilds protos so
      # a writer regression turns this job red even if binary assets are stale.
      - name: Rebuild package-built proto fonts
        if: matrix.sdk == 'stable'
        run: python3 tool/build_proto_fonts.py

      - name: Validate generated fonts against fonttools
        if: matrix.sdk == 'stable'
        run: |
          python3 tool/oracle/validate_font.py example/fonts/my_icons.otf
          python3 tool/oracle/validate_font.py \
            --variable example/fonts/proto/variable_cff2.otf \
            --static-prefix example/fonts/proto/static_

      # Same gate set against a three-master font (interior default). Built to
      # a temp path rather than example/fonts/proto/ because nothing renders
      # it — committing it would only add weight to the pub tarball.
      #
      # Must stay after "Rebuild package-built proto fonts", and not only for
      # the static references: the SVG input directory below is gitignored
      # build output that exists solely as a side effect of that step. Reorder
      # these and the CLI exits 65 with "input directory is not a directory or
      # it doesn't exist".
      #
      # --default-stroke-width is 1.5 to match the oracle's hard-coded mid
      # stop. That is what turns validate_interpolation's lerp check into a
      # real test of the third master: it asserts the interior master lands
      # where interpolating the two endpoints to 1.5 would, i.e. that an
      # interior default does not bend the axis. Change one of the two numbers
      # without the other and the check quietly stops proving that.
      - name: Validate a three-master variable font against fonttools
        if: matrix.sdk == 'stable'
        run: |
          dart run bin/fontify_plus.dart \
            tool/variable_prototype/out/render_matrix_svgs/width_2.0 \
            "$RUNNER_TEMP/variable_cff2_default.otf" \
            --font-name=ProtoCff2Default --no-normalize \
            --stroke-width-range=1.33,2 --default-stroke-width=1.5
          python3 tool/oracle/validate_font.py \
            --variable "$RUNNER_TEMP/variable_cff2_default.otf" \
            --static-prefix example/fonts/proto/static_

  variable-stroke-render-matrix:
    name: Variable stroke render matrix (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-web

      - name: Install a chromedriver matching this runner's Chrome
        run: |
          set -euo pipefail
          chrome_version="$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')"
          chrome_major="${chrome_version%%.*}"
          echo "Runner Chrome: $chrome_version (major $chrome_major)"
          driver_url="$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r --arg major "$chrome_major" \
              '[.versions[] | select(.version | startswith($major + "."))] | last | .downloads.chromedriver[] | select(.platform=="linux64") | .url')"
          echo "chromedriver: $driver_url"
          mkdir -p "$RUNNER_TEMP/chromedriver"
          curl -fsSL "$driver_url" -o "$RUNNER_TEMP/chromedriver.zip"
          unzip -j -o "$RUNNER_TEMP/chromedriver.zip" "*/chromedriver" -d "$RUNNER_TEMP/chromedriver"
          chmod +x "$RUNNER_TEMP/chromedriver/chromedriver"
          echo "$RUNNER_TEMP/chromedriver" >> "$GITHUB_PATH"

      - name: Start chromedriver
        run: |
          chromedriver --port=4444 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4444/status && exit 0
            sleep 1
          done
          echo "chromedriver never became ready" >&2
          exit 1

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      # Root package config for `dart run bin/fontify_plus.dart` inside
      # build_proto_fonts.py — example/ flutter pub get does not create it.
      - name: Install package dependencies
        run: dart pub get --no-example

      # Rebuild proto assets with the package CLI so the matrix judges this
      # commit's writer, not a stale committed fixture.
      - name: Rebuild package-built proto fonts
        run: python3 tool/build_proto_fonts.py

      # TEMPORARY diagnostic: the matrix reports every family rendering the
      # same 624 bytes of ink, which means no app font is registering — and
      # that reproduces on neither macOS nor a Linux container pinned to this
      # runner's exact Chrome, chromedriver and Flutter. This says whether the
      # build even shipped the fonts, which a test cannot: `flutter drive`
      # aggregates a web run and swallows `print`.
      - name: Diagnose the built asset bundle
        working-directory: example
        run: |
          set -x
          google-chrome --version
          ls -la fonts/proto/
          md5sum fonts/proto/*.otf
          flutter build web --debug
          echo '--- FontManifest.json ---'
          cat build/web/assets/FontManifest.json
          echo '--- bundled font assets ---'
          ls -la build/web/assets/fonts/proto/ || echo 'NO fonts/proto IN BUNDLE'
          md5sum build/web/assets/fonts/proto/*.otf || true
          echo '--- AssetManifest keys mentioning proto ---'
          cat build/web/assets/AssetManifest.json 2>/dev/null | tr ',' '\n' | grep -i proto || true

      # `-d chrome` treats Chrome as the running device and connects to it
      # through DWDS's own debug-service handshake — verified against a real
      # run on this workflow's ubuntu-latest runner, that handshake throws
      # AppConnectionException and the process then hangs indefinitely
      # instead of failing (also reproduced locally on macOS with matched
      # Chrome/chromedriver versions, so this isn't runner-specific). `-d
      # web-server --browser-name=chrome` sidesteps DWDS for driving
      # entirely: flutter_tools serves the app over plain HTTP and the
      # `webdriver` package drives a chromedriver-controlled browser session
      # against it directly — the actual mechanism CI recipes for this use in
      # practice, unlike `-d chrome`'s development-workflow path.
      - name: Run the variable stroke render matrix on Chrome (CanvasKit)
        working-directory: example
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/variable_stroke_test.dart \
            -d web-server --browser-name=chrome --headless \
            --web-port=8765 --driver-port=4444

      # NOT COVERED by this workflow, and not silently assumed to pass:
      #   - Chrome/skwasm (`flutter drive ... -d chrome --wasm`): same runner,
      #     no extra infrastructure, but `flutter drive`'s web output
      #     aggregates all assertions into one pass/fail block per run and
      #     was unreliable to parse per-test even locally (task-4-report.md).
      #     Left out to avoid a gate that can't localize its own failures.
      #   - macOS desktop / iOS simulator: needs a macOS runner
      #     (`runs-on: macos-latest`) plus, for iOS, a booted simulator; adds
      #     real minutes to every push. A future job can add
      #     `runs-on: macos-latest` and `flutter test ... -d macos` cheaply;
      #     iOS additionally needs `xcrun simctl boot`.
      #   - Android emulator: needs `reactivecircus/android-emulator-runner`
      #     or equivalent, which boots a full AVD (KVM acceleration only
      #     available on Linux runners, several minutes per boot) — slow
      #     enough that Task 14 does not add it as a blocking gate.
      #   - Linux and Windows desktop: Task 4 never ran these either (no
      #     target existed on the Darwin host that measured the matrix); the
      #     evidence gap documented in tool/variable_prototype/README.md
      #     stands.

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Dry-run publish
        run: dart pub publish --dry-run
