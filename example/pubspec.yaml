name: fontify_plus_example
description: Flutter web demo for fontify_plus-generated icon fonts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  fontify_plus:
    path: ../
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: My Icons
      fonts:
        - asset: fonts/my_icons.otf
    - family: ProtoGvar
      fonts:
        - asset: fonts/proto/variable_gvar.ttf
    - family: ProtoCff2
      fonts:
        - asset: fonts/proto/variable_cff2.otf
    - family: ProtoCff133
      fonts:
        - asset: fonts/proto/static_1.33_cff.otf
    - family: ProtoCff150
      fonts:
        - asset: fonts/proto/static_1.5_cff.otf
    - family: ProtoCff200
      fonts:
        - asset: fonts/proto/static_2.0_cff.otf
    - family: ProtoGlyf133
      fonts:
        - asset: fonts/proto/static_1.33_glyf.otf
    - family: ProtoGlyf150
      fonts:
        - asset: fonts/proto/static_1.5_glyf.otf
    - family: ProtoGlyf200
      fonts:
        - asset: fonts/proto/static_2.0_glyf.otf
